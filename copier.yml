# copier.yml
run_setup:
  # computed value to determine whether to prompt the setup questions
  type: bool
  default: "{{recorded_setup is not defined or recorded_setup is false}}"
  when: false

author:
  type: str
  help: Who created this repo?
  default: MAPP Metabolomics Unit
  required: true
  when: "{{run_setup}}"

email:
  type: str
  help: What is your email?
  default: pierre-marie.allard@unifr.ch
  required: true
  # when: "{{run_setup}}"

repository_name:
  type: str
  help: The name of the repository on GitHub. Should be lowercase and dash-separated.
  default: johnny-watanabe-group
  # when: "{{run_setup}}"
  validator: >-
    {% if not (repository_name | regex_search('^[a-z][a-z0-9\-]+$')) %}
    repository_name must start with a letter, followed by one or more letters, digits, or dashes all lowercase.
    {% endif %}
  required: true

github_username:
  type: str
  help: What is your GitHub username?
  default: mapp-metabolomics-unit
  required: true
  # when: "{{run_setup}}"

git_repo_path:
  type: str
  help: The path to the repository containing the templated repo on your local system.
  default: /home/allardpm/git_repos/mapp-metabolomics-unit
  required: true

mapp_project:
  type: str
  help: The name of the project in the MAPP Metabolomics Unit.
  required: true
  default: mapp_project_00001

mapp_batch:
  type: str
  help: The name of the batch in the MAPP Metabolomics Unit.
  required: true
  default: mapp_batch_00001

mapp_batch_description:
  type: str
  help: The description of the batch in the MAPP Metabolomics Unit.
  required: False
  default: "Untargeted metabolomics of Trigonostemon cherrieri leaves in drought and healthy conditions"

ionization_mode:
  type: str
  help: "What is the ionization mode of the study?"
  choices:
    - positive
    - negative
  required: true


gnps_job_id:
  type: str
  help: The GNPS job ID (optional).
  required: false

target_variable:
  type: str
  help: The target variable for the analysis (optional)
  required: false
  default: source_taxon

_tasks:
  - chmod +x ./project_init.sh
  - chmod +x ./project_update.sh
  - >-
    {% if run_setup %}
    ./project_init.sh
    {% else %}
    ./project_update.sh
    {% endif %}
