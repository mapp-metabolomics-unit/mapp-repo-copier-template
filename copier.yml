# copier.yml
run_setup:
  # computed value to determine whether to prompt the setup questions
  type: bool
  default: "{{recorded_setup is not defined or recorded_setup is false}}"
  when: false

author:
  type: str
  help: Who created this repo?
  default: MAPP Metabolomics Unit
  required: true
  when: "{{run_setup}}"

email:
  type: str
  help: What is your email?
  default: pierre-marie.allard@unifr.ch
  required: true
  when: "{{run_setup}}"

user_provided_year_of_creation:
  type: str
  help: When was the project created?
  when: "{{run_setup}}"

year_of_creation:
  type: str
  # computed value for the year of creation from
  # either the previously recorded answer
  # or the answer the user just provided during setup
  default: "{{recorded_year_of_creation or user_provided_year_of_creation}}"
  when: false

user_provide_repository_name:
  type: str
  help: The name of the repository on GitHub. Should be lowercase and dash-separated.
  default: johnny-watanabe-group
  when: "{{run_setup}}"
  validator: >-
    {% if not (repository_name | regex_search('^[a-z][a-z0-9\-]+$')) %}
    repository_name must start with a letter, followed by one or more letters, digits, or dashes all lowercase.
    {% endif %}
  required: true

repository_name:
  type: str
  # computed value for the repository name from
  # either the previously recorded answer
  # or the answer the user just provided during setup
  default: "{{recorded_repository_name or user_provide_repository_name}}"
  when: false


user_provided_github_username:
  type: str
  help: What is your GitHub username?
  default: mapp-metabolomics-unit
  required: true
  when: "{{run_setup}}"

github_username:
  type: str
  # computed value for the GitHub username from
  # either the previously recorded answer
  # or the answer the user just provided during setup
  default: "{{recorded_github_username or user_provided_github_username}}"
  when: false

user_provide_mapp_project:
  type: str
  help: The name of the project in the MAPP Metabolomics Unit.
  default: mapp_project_00001

mapp_project:
  type: str
  # computed value for the MAPP project name from
  # either the previously recorded answer
  # or the answer the user just provided during setup
  default: "{{recorded_mapp_project_name or user_provide_mapp_project_name}}"
  when: false

user_provided_mapp_batch:
  type: str
  help: The name of the batch in the MAPP Metabolomics Unit.
  default: mapp_batch_00001


mapp_batch:
  type: str
  # computed value for the MAPP batch name from
  # either the previously recorded answer
  # or the answer the user just provided during setup
  default: "{{recorded_mapp_batch_name or user_provided_mapp_batch_name}}"
  when: false


_tasks:
  - chmod +x ./project_init.sh
  - chmod +x ./project_update.sh
  - >-
    {% if run_setup %}
    ./project_init.sh
    {% else %}
    ./project_update.sh
    {% endif %}